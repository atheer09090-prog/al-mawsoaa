<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafbf7"><title>أسرار قلعة بهلاء</title><style>*{box-sizing:border-box}body{margin:0;background:#082e31;color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}main{max-width:650px;margin:auto;padding:24px 15px 45px}.panel{background:linear-gradient(145deg,#205d59,#0b3439);border:1px solid #6d9891;border-radius:24px;padding:25px 20px;box-shadow:0 18px 45px #001a1b88}.top{text-align:center;color:#f8d88e;font-size:14px;line-height:2}h1{text-align:center;color:#ffe1a0;font-size:clamp(28px,7vw,44px);line-height:1.45}h2{color:#ffe1a0}p{line-height:2;font-size:17px}.hero{text-align:center;font-size:75px;margin:20px}.btn{display:block;width:100%;background:#f7d88f;border:0;border-radius:15px;padding:17px;color:#103a38;font-size:19px;font-weight:bold;cursor:pointer;margin-top:13px;text-align:center}.btn:active{transform:scale(.98)}.option{display:block;width:100%;padding:15px;margin:11px 0;text-align:right;background:#f1f7f4;color:#123d3c;border:2px solid transparent;border-radius:12px;font-size:17px;cursor:pointer}.option:disabled{opacity:1}.correct{background:#bdf1d0!important;border-color:#19a25e!important}.wrong{background:#ffd0d0!important;border-color:#d43e43!important}.small{font-size:14px;color:#d2e6df}.progress{height:10px;background:#426c68;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#eac574;transition:width .3s}.badge{display:inline-block;background:#ffffff22;border-radius:40px;padding:8px 14px}.feedback{border-radius:12px;padding:14px;background:#ffffff17;margin-top:15px;line-height:1.8}a{color:#ffe1a0}input{font-size:18px;padding:14px;width:100%;border-radius:12px;border:0}footer{text-align:center;margin-top:20px;color:#b8d2ca;font-size:13px}button:focus-visible{outline:3px solid #fff}</style>
<style>
@font-face{font-family:"Noto Sans Arabic";src:url("../../fonts/noto-sans-arabic-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url("../../fonts/ibm-plex-sans-arabic-600.woff2") format("woff2");font-weight:600;font-display:swap}
body{background:#fafbf7;color:#213832;font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif}
h1,h2,.top,.btn{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif}
main{max-width:760px;padding:28px 20px 48px}.panel{background:linear-gradient(150deg,#fff 0%,#fafbf7 100%);border:1px solid #e1e6dc;border-radius:24px;box-shadow:0 16px 42px rgba(23,56,74,.08)}
.top{color:#555d3e}.hero{font-size:64px;margin:12px}.badge{background:#eef0e4;color:#555d3e}.btn{background:#17384a;color:#fff;border-radius:99px;padding:14px 20px;font-size:17px;transition:background .2s,transform .2s}.btn:hover{background:#102b39;transform:translateY(-1px)}.btn:active{transform:scale(.98)}.option{background:#fff;color:#213832;border:1px solid #e1e6dc;border-radius:14px;font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif;transition:border-color .18s,background .18s,transform .18s}.option:hover:not(:disabled){border-color:#9a9f76;background:#f7f8f2;transform:translateY(-1px)}.correct{background:#e6f1e9!important;border-color:#367557!important;color:#213832}.wrong{background:#f8e9e5!important;border-color:#963d31!important;color:#213832}.progress{background:#eef0e4}.progress>div{background:#bf8c34}.feedback{background:#eef0e4;color:#213832}.small{color:#62706a}.panel h1,.panel h2{color:#17384a}a{color:#17384a}input{border:1px solid #e1e6dc;color:#213832}footer{color:#62706a}button:focus-visible,input:focus-visible{outline:3px solid #bf8c34;outline-offset:3px}
@media(max-width:520px){main{padding:16px 12px 32px}.panel{padding:22px 16px}.hero{font-size:54px}p{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head><body><main><div class="top">مسابقة أفضل محتوى رقمي • مغامرة من الموسوعة العُمانية</div><section class="panel" id="app" aria-live="polite"><div class="hero">🏰🗝️</div><h1>أسرار قلعة بهلاء</h1><p style="text-align:center">تُخفي القلعة سبعة أبواب من المعرفة! اقرأ الدليل عند كل باب، وأجب عن السؤال لتحصل على المفتاح الذهبي.</p><div style="text-align:center"><span class="badge">٧ أبواب</span> <span class="badge">٧٠ نقطة</span> <span class="badge">شهادة مستكشف</span></div><button class="btn" id="start">ابدأ المغامرة ←</button></section><footer>المصدر: مقال «قلعة بهلاء: حصن الغموض والتاريخ الممتد في قلب عُمان» — الموسوعة العُمانية</footer></main><script>
const source='https://omanki.com/قلعة-بهلاء-حصن-الغموض-والتاريخ-الممتد/';
const qs=[
{t:'بوابة المكان',hint:'تقع قلعة بهلاء في واحة بهلاء بمحافظة الداخلية.',q:'في أي محافظة تقع قلعة بهلاء؟',o:['محافظة ظفار','محافظة الداخلية','محافظة مسندم'],a:1,ex:'تقع قلعة بهلاء في محافظة الداخلية.'},
{t:'بوابة الطبيعة',hint:'تقوم القلعة على تلة صخرية مرتفعة تطل على المنطقة المحيطة.',q:'على ماذا شُيدت القلعة؟',o:['تلة صخرية مرتفعة','جزيرة بحرية','سهل رملي منخفض'],a:0,ex:'الموقع المرتفع ساعد في مراقبة المناطق المحيطة.'},
{t:'بوابة البناء',hint:'استُخدم اللبن الطيني المدعّم بالحجارة في بناء القلعة.',q:'ما المادة الأساسية في بناء قلعة بهلاء؟',o:['الزجاج','الحديد','اللبن الطيني'],a:2,ex:'تُعد القلعة مثالًا بارزًا للعمارة الطينية العُمانية.'},
{t:'بوابة الواحة',hint:'يحيط بالواحة سور بهلاء العظيم لحماية المنطقة القديمة.',q:'ما الذي يحيط بواحة بهلاء القديمة؟',o:['سور تاريخي','نفق تحت البحر','جسر زجاجي'],a:0,ex:'شكّل السور جزءًا من منظومة الحماية والدفاع.'},
{t:'بوابة الماء',hint:'ساعدت الأفلاج على ري الواحة واستمرار الزراعة.',q:'ما نظام الري التقليدي المذكور في المقال؟',o:['الثلوج','الأفلاج','الأمواج'],a:1,ex:'الأفلاج من أبرز أنظمة الري التقليدية في عُمان.'},
{t:'بوابة الدفاع',hint:'استُخدمت الأبراج والفتحات الصغيرة للمراقبة والدفاع.',q:'ما وظيفة الأبراج الدفاعية في القلعة؟',o:['مراقبة المنطقة وحمايتها','تربية الأسماك','إنتاج الكهرباء'],a:0,ex:'الأبراج عنصر أساسي في تصميم الحصون الدفاعية.'},
{t:'بوابة التاريخ',hint:'من أجزاء القلعة القديمة القصبة، التي ارتبطت بالعصر النبهاني.',q:'أي جزء من القلعة يرتبط بالعصر النبهاني؟',o:['محطة القطار','القصبة','المطار'],a:1,ex:'القصبة من أقدم أجزاء قلعة بهلاء.'}
];let i=0,points=0,locked=false,audio=null;const app=document.getElementById('app');
function tone(ok){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const notes=ok?[523,659,784]:[260,195];notes.forEach((freq,n)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type=ok?'sine':'triangle';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,now+n*.12);gain.gain.exponentialRampToValueAtTime(.13,now+n*.12+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+n*.12+.17);osc.connect(gain);gain.connect(audio.destination);osc.start(now+n*.12);osc.stop(now+n*.12+.18)})}catch(e){}}
function render(){locked=false;let x=qs[i];app.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><span class="badge">الباب ${i+1} من ${qs.length}</span><span class="badge">⭐ ${points} نقطة</span></div><div class="progress" style="margin-top:15px"><div style="width:${i/qs.length*100}%"></div></div><div class="hero">${['🧭','⛰️','🧱','🏰','💧','🛡️','🗝️'][i]}</div><h2>${x.t}</h2><p class="small">${x.hint}</p><h2 style="font-size:20px;color:#17384a">${x.q}</h2><div id="choices"></div><div id="result" aria-live="polite"></div>`;let choices=document.getElementById('choices');x.o.forEach((v,n)=>{let b=document.createElement('button');b.className='option';b.textContent=v;b.addEventListener('click',()=>choose(n));choices.appendChild(b)})}
function choose(n){if(locked)return;locked=true;let x=qs[i],ok=n===x.a;if(ok)points+=10;tone(ok);document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('correct');else if(k===n)b.classList.add('wrong')});let r=document.getElementById('result');r.innerHTML=`<div class="feedback"><strong>${ok?'🎉 إجابة صحيحة! حصلت على مفتاح ذهبي.':'🔎 إجابة غير صحيحة، تابع الاستكشاف!'}</strong><div>${x.ex}</div></div><button class="btn" id="next">${i===qs.length-1?'افتح صندوق الكنز 🏆':'انتقل إلى الباب التالي ←'}</button>`;document.getElementById('next').addEventListener('click',()=>{i++;i<qs.length?render():finish()})}
function finish(){app.innerHTML=`<div class="hero">🏆✨</div><h1>اكتملت المغامرة!</h1><p style="text-align:center">اكتشفت أسرار قلعة بهلاء، وتعرفت على جانب من تراث عُمان.</p><h2 style="text-align:center">نتيجتك: ${points} / 70</h2><div class="feedback" style="text-align:center"><h2>شهادة مستكشف قلعة بهلاء</h2><p>تُمنح هذه الشهادة إلى</p><input id="name" placeholder="اكتب اسم المستكشف" maxlength="60"><p>تقديرًا لإكمال المغامرة التعليمية</p></div><button class="btn" id="print">طباعة الشهادة</button><button class="btn" id="again" style="background:#cce5dc">العب مرة أخرى</button><p class="small" style="text-align:center"><a href="${source}" target="_blank" rel="noopener">اقرأ المقال الأصلي في الموسوعة العُمانية ↗</a></p>`;document.getElementById('again').onclick=()=>{i=0;points=0;render()};document.getElementById('print').onclick=()=>{let name=document.getElementById('name').value.trim()||'مستكشف عُمان';let w=window.open('','_blank');if(!w){alert('للطباعة افتح اللعبة في متصفح Safari أو Chrome');return}w.document.write(`<html lang="ar" dir="rtl"><meta charset="utf-8"><style>body{text-align:center;font-family:Tahoma;padding:80px;border:15px double #b99952;color:#194641}h1{font-size:40px}p{font-size:24px}</style><h1>🏆 شهادة مستكشف قلعة بهلاء</h1><p>تُمنح إلى</p><h1>${name.replace(/[<>&]/g,'')}</h1><p>لإتمام المغامرة التعليمية عن قلعة بهلاء</p><p>النتيجة: ${points} من 70</p></html>`);w.document.close();w.focus();w.print()}}
document.getElementById('start').addEventListener('click',()=>{tone(true);render()});
</script></body></html>
