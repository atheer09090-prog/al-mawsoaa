<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f8f2">
<title>مغامرة النبات العُماني</title>
<style>
:root{color-scheme:light;--ink:#18384a;--olive:#727950;--gold:#b68a4a;--paper:#fbfaf5;--soft:#f1f0e5;--line:#dedfce;--green:#39755e;--red:#a34f43;font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);min-height:100dvh;display:grid;place-items:center;padding:20px}.game{width:min(850px,100%);min-height:min(690px,calc(100dvh - 40px));background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 65px #18384a12;display:flex;flex-direction:column;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 28px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-weight:700}.mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--olive)}.mark svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.progress{display:flex;align-items:center;gap:10px;color:var(--olive);font-size:13px}.track{width:116px;height:5px;background:var(--soft);border-radius:10px;overflow:hidden}.track i{display:block;height:100%;width:var(--progress,0%);background:var(--olive);transition:width .35s ease}.screen{flex:1;padding:clamp(26px,6vw,58px);display:flex;flex-direction:column;justify-content:center;animation:enter .35s ease both}.eyebrow{color:var(--olive);font-size:14px;font-weight:700;letter-spacing:.02em}h1,h2{line-height:1.5;margin:8px 0 12px;letter-spacing:-.03em}h1{font-size:clamp(30px,5vw,48px)}h2{font-size:clamp(24px,4vw,34px)}p{color:#65727a;line-height:1.9;margin:0 0 24px;font-size:16px}.hero{max-width:650px}.hero-mark{width:54px;height:54px;margin-bottom:24px;color:var(--olive)}.hero-mark svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.btn{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 20px;background:white;color:var(--ink);cursor:pointer;transition:transform .18s,background .18s,border-color .18s}.btn:hover{transform:translateY(-2px);border-color:var(--olive)}.btn:active{transform:scale(.98)}.btn:focus-visible,.choice:focus-visible{outline:3px solid #b68a4a77;outline-offset:3px}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.primary:hover{background:#244e62}.secondary{background:var(--soft)}.instructions{display:grid;gap:12px;padding:0;list-style:none;margin:4px 0 20px}.instructions li{display:flex;gap:12px;align-items:center;color:#50616a}.n{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--olive);font-weight:700}.stations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 20px}.station{text-align:right;border:1px solid var(--line);border-radius:16px;background:white;padding:16px;cursor:pointer;min-height:94px;transition:transform .18s,border-color .18s,background .18s}.station:hover{transform:translateY(-2px);border-color:var(--olive);background:#fbfbf7}.station small{display:block;color:var(--olive);margin-bottom:5px}.station b{font-size:16px}.station.done{border-color:#cbd8cd;background:#f5f8f3}.q-label{margin-bottom:8px}.choices{display:grid;gap:10px;margin:16px 0}.choice{width:100%;text-align:right;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:13px;min-height:54px;padding:12px 16px;cursor:pointer;transition:border-color .18s,background .18s}.choice:hover{border-color:var(--olive)}.choice.selected{border-color:var(--olive);background:var(--soft)}.choice:disabled{cursor:default}.feedback{border-radius:13px;padding:14px 16px;margin:4px 0 8px;line-height:1.8}.feedback.good{background:#eff6f0;color:#2e644b}.feedback.try{background:#fbf1ee;color:#8e493f}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.end{border:1px solid var(--line);border-radius:16px;background:#faf9f2;padding:17px;line-height:1.9;color:#59655b}.end strong{display:block;color:var(--olive);margin-bottom:4px}.foot{padding:14px 28px;border-top:1px solid var(--line);font-size:12px;color:#879096;text-align:center}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:540px){body{padding:0}.game{min-height:100dvh;border-radius:0;border:0}.top{padding:16px 18px}.track{width:70px}.screen{padding:28px 20px}.stations{grid-template-columns:1fr}.station{min-height:76px}.foot{padding:12px 16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="game" aria-live="polite">
<header class="top"><div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21c0-6 2-10 7-14M12 21c0-4-2-7-6-9M13 14c4 0 7-2 8-6-4-.5-7 1-8 6ZM9 14c-.3-4-3-6-7-6 0 4 2 7 7 6Z"/></svg></span><span>مغامرة النبات العُماني</span></div><div class="progress"><span id="status">البداية</span><span class="track" aria-hidden="true"><i id="meter"></i></span></div></header>
<div id="screen" class="screen"></div>
<footer class="foot">تعلّم، اكتشف، واحمِ نباتات عُمان</footer>
</main>
<script>
(()=>{'use strict';const leaf='<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 54c2-19 12-33 42-44 1 25-10 42-31 43M14 52l29-31M25 42l-1-12M34 33l12 1"/></svg>';const stations=[
{title:'بيئات النباتات',subtitle:'سؤال عن التكيّف',q:'ما العامل الذي يرتبط به شكل النبات وطريقة نموّه؟',choices:['لون السماء فقط','البيئة التي يعيش فيها','عدد أوراق الكتاب'],correct:1,explain:'شكل النبات وطريقة نموّه يرتبطان ببيئته، مثل الماء والتربة والضوء والرطوبة.'},
{title:'النباتات المائية',subtitle:'ماء وطحالب',q:'أي عبارة صحيحة عن النباتات المائية؟',choices:['كلها طافية على السطح','قد تكون طافية أو مغمورة كليًا أو جزئيًا','لا تعيش إلا في المياه المالحة'],correct:1,explain:'تختلف النباتات المائية؛ فمنها الطافي ومنها المغمور كليًا أو جزئيًا.'},
{title:'الحزازيات',subtitle:'عالم صغير رطب',q:'أين تكثر الحزازيات غالبًا؟',choices:['في الأماكن الرطبة والظليلة','في الأماكن شديدة الجفاف فقط','داخل الرمال الجافة دائمًا'],correct:0,explain:'الحزازيات صغيرة ومنخفضة النمو، وتكثر غالبًا في الأماكن الرطبة والظليلة.'},
{title:'السراخس والزهريات',subtitle:'كيف تتكاثر؟',q:'بماذا تتكاثر السراخس؟',choices:['بالأزهار','بالأبواغ','بالثمار فقط'],correct:1,explain:'تتكاثر السراخس بالأبواغ، لا بالبذور.'},
{title:'كنز النباتات العُمانية',subtitle:'اللبان والقرم والعلعلان',q:'أي نبات تشتهر به محافظة ظفار؟',choices:['اللبان','القمح','دوار الشمس'],correct:0,explain:'تشتهر محافظة ظفار باللبان، وله قيمة تراثية واقتصادية ارتبطت بالتجارة عبر التاريخ.'}];let page='intro',idx=0,selected=-1,checked=false,done=new Set();const root=document.querySelector('#screen'),status=document.querySelector('#status'),meter=document.querySelector('#meter');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(next){page=next;selected=-1;checked=false;render()}function render(){status.textContent=page==='intro'?'البداية':page==='guide'?'كيف نلعب؟':page==='map'?'خريطة المغامرة':page==='end'?'اكتملت المغامرة':`المحطة ${idx+1} من ٥`;meter.style.setProperty('--progress',`${Math.round(done.size/5*100)}%`);root.innerHTML='';root.className='screen';if(page==='intro'){root.innerHTML=`<div class="hero"><div class="hero-mark">${leaf}</div><span class="eyebrow">رحلة قصيرة في طبيعة عُمان</span><h1>مغامرة النبات العُماني</h1><p>اكتشفي تنوّع النباتات وبيئاتها عبر خمس محطات تفاعلية.</p><div class="actions"><button class="btn primary" data-go="guide">ابدئي المغامرة <span aria-hidden="true">←</span></button></div></div>`}else if(page==='guide'){root.innerHTML=`<span class="eyebrow">قبل الانطلاق</span><h2>كيف نلعب؟</h2><p>أجيبي عن سؤال كل محطة، وتعرّفي على معلومة جديدة في الطريق.</p><ol class="instructions"><li><span class="n">١</span>اختاري محطة من الخريطة.</li><li><span class="n">٢</span>حددي الإجابة ثم تحقّقي منها.</li><li><span class="n">٣</span>يمكنك المحاولة مجددًا أو العودة للخريطة.</li></ol><div class="actions"><button class="btn primary" data-go="map">إلى خريطة المحطات</button></div>`}else if(page==='map'){root.innerHTML=`<span class="eyebrow">خمس محطات، وخمس أوراق خضراء</span><h2>خريطة المغامرة</h2><p>اختاري محطة لبدء التحدّي. يمكنك الرجوع إلى الخريطة في أي وقت.</p><div class="stations">${stations.map((s,i)=>`<button class="station ${done.has(i)?'done':''}" data-station="${i}"><small>المحطة ${i+1}${done.has(i)?' · مكتملة':''}</small><b>${esc(s.title)}</b></button>`).join('')}</div><div class="actions"><button class="btn secondary" data-go="intro">العودة للبداية</button></div>`}else if(page==='question'){const s=stations[idx];root.innerHTML=`<span class="eyebrow">المحطة ${idx+1} · ${esc(s.title)}</span><h2>${esc(s.q)}</h2><p class="q-label">اختاري إجابة واحدة، ثم تحقّقي من الإجابة.</p><div class="choices" role="group" aria-label="خيارات الإجابة">${s.choices.map((x,i)=>`<button class="choice ${selected===i?'selected':''}" data-choice="${i}" ${checked?'disabled':''}>${esc(x)}</button>`).join('')}</div>${checked?`<div class="feedback ${selected===s.correct?'good':'try'}" role="status">${selected===s.correct?'أحسنتِ! إجابة صحيحة.':'حاولي مرة أخرى. لا بأس، التعلّم رحلة من المحاولة والاكتشاف.'}${selected===s.correct?`<br>${esc(s.explain)}`:''}</div>`:''}<div class="actions">${!checked?`<button class="btn primary" data-check ${selected<0?'disabled':''}>تحقّقي من الإجابة</button>`:selected===s.correct?`<button class="btn primary" data-continue>${idx===4?'إلى تحدّي الختام':'العودة إلى خريطة المحطات'}</button>`:`<button class="btn primary" data-retry>العودة للسؤال</button>`}<button class="btn secondary" data-go="map">خريطة المحطات</button></div>`}else{root.innerHTML=`<div class="hero"><div class="hero-mark">${leaf}</div><span class="eyebrow">وصلتِ إلى نهاية المغامرة</span><h1>تحدّي الختام</h1><p>اذكري سلوكًا واحدًا يساعد على حماية النباتات العُمانية.</p><div class="end"><strong>تذكّري</strong>لا نقتلع النباتات ولا نتلف موائلها، ونستخدم الموارد الطبيعية استخدامًا مستدامًا.</div><div class="actions"><button class="btn primary" data-go="intro">العودة إلى البداية</button><button class="btn secondary" data-go="map">إعادة زيارة المحطات</button></div></div>`}root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));root.querySelectorAll('[data-station]').forEach(b=>b.addEventListener('click',()=>{idx=Number(b.dataset.station);show('question')}));root.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.choice);render();root.querySelector(`[data-choice="${selected}"]`)?.focus()}));root.querySelector('[data-check]')?.addEventListener('click',()=>{if(selected<0)return;checked=true;if(selected===stations[idx].correct)done.add(idx);render()});root.querySelector('[data-retry]')?.addEventListener('click',()=>{checked=false;selected=-1;render()});root.querySelector('[data-continue]')?.addEventListener('click',()=>{if(idx===4)show('end');else show('map')})}render()})();
</script>
</body>
</html>
